# pnpm 11 gates postinstall scripts. Without these allowed here, every pnpm command —
# including `pnpm dev` — fails its deps-status check with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  # Next's image optimiser, used in production now that next.config enables optimisation.
  sharp: true
  # Native resolver used by eslint-config-next.
  unrs-resolver: true
