# pnpm 11 gates postinstall scripts. Without sharp allowed here, every pnpm command —
# including `pnpm dev` — fails its deps-status check with ERR_PNPM_IGNORED_BUILDS.
# sharp is Next's image optimiser: unused while next.config.mjs sets images.unoptimized,
# but allowing the build keeps that switch reversible.
allowBuilds:
  sharp: true
